name: Arduino compile
on: [push, pull_request]
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: '1.6.0'
      - run: arduino-cli core update-index
      - run: arduino-cli core install arduino:avr@1.8.8
      - run: arduino-cli lib install --no-deps "Adafruit BusIO@1.17.4" "Adafruit PN532@1.3.4" "LiquidCrystal@1.0.7"
      - run: arduino-cli compile --fqbn arduino:avr:uno leitor_nfc
